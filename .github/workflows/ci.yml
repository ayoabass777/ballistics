# CI: Python tests, frontend checks and dbt compile on every push and pull request.
# No deploy here; staging still deploys with deploy/deploy_staging.sh.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PGUSER: ci
  PGPASSWORD: ci

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Throwaway database for the integration tests gated on *_TEST_DSN.
      # Matches staging (postgres:17).
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PROJECT_ROOT: ${{ github.workspace }}
      FLOW_TEST_DSN: postgresql://ci:ci@localhost:5432/flow_test
      FORECAST_TEST_DSN: postgresql://ci:ci@localhost:5432/forecast_test
      FORECAST_API_TEST_DSN: postgresql://ci:ci@localhost:5432/forecast_test_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # the engine and API images; Airflow runs 3.10
          cache: pip
          cache-dependency-path: |
            etl/requirements.txt
            engine/requirements.txt
            engine/api/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r etl/requirements.txt -r engine/requirements.txt \
                      -r engine/api/requirements.txt pytest httpx
      - name: Create one database per integration suite
        # The suites drop and recreate schemas, so they don't share a database.
        run: |
          for db in flow_test forecast_test forecast_test_api; do
            psql -h localhost -d ci -c "CREATE DATABASE $db"
          done
      - name: Compile DAGs
        # Airflow isn't installed here, so this checks syntax only.
        run: python -m py_compile airflow/dags/*.py
      - name: Run tests
        run: python -m pytest -q tests engine/tests

  account-api-tests:
    # The account API (API/) has its own requirements. Its opt-in Postgres
    # tests run against a database set up the way the staging deploy does it,
    # connected as the restricted account_api role, so a missing grant or DDL
    # in the request path fails here instead of on staging.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ballistics
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGDATABASE: ballistics
      # Owner connection, used only for setup and the owner-only test below.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ballistics
      ACCOUNT_URL: postgresql://account_api:account@localhost:5432/ballistics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # API/Dockerfile
          cache: pip
          cache-dependency-path: API/requirements.txt
      - name: Install dependencies
        run: pip install -r API/requirements.txt pytest
      - name: Set up the database like staging
        # Same order as deploy/deploy_staging.sh: migrations, account
        # bootstrap, (dbt build: here a small seed), grants. Roles as in
        # deploy/postgres-init/01-roles.sh.
        run: |
          python scripts/migrate.py up
          psql -v ON_ERROR_STOP=1 -q -f API/sql/bootstrap_accounts.sql
          psql -v ON_ERROR_STOP=1 -q <<'SQL'
          CREATE ROLE account_api LOGIN PASSWORD 'account';
          CREATE ROLE research_reader LOGIN PASSWORD 'research';
          ALTER ROLE research_reader SET default_transaction_read_only = on;
          SQL
          psql -v ON_ERROR_STOP=1 -q -f API/tests/postgres_seed.sql
          psql -v ON_ERROR_STOP=1 -q -f deploy/grants.sql
      - name: Run tests as account_api
        env:
          BILLING_TEST_DATABASE_URL: ${{ env.ACCOUNT_URL }}
          FOLLOWED_LEAGUES_TEST_DATABASE_URL: ${{ env.ACCOUNT_URL }}
          PREFERENCES_TEST_DATABASE_URL: ${{ env.ACCOUNT_URL }}
          TEST_ACCOUNT_POSTGRES: "1"
          ACCOUNT_DB_USER: account_api
          ACCOUNT_DB_PASSWORD: account
          ACCOUNT_DB_HOST: localhost
          ACCOUNT_DB_PORT: "5432"
          ACCOUNT_DB_NAME: ballistics
        run: python -m pytest -q -rs API/tests --deselect API/tests/test_shared_saved_postgres.py
      - name: Run owner-only tests
        # test_shared_saved_postgres re-applies API/sql/shared_saved_snapshots.sql
        # and creates a partition to exercise scripts/archive_saved_snapshots.py:
        # schema maintenance that the deploy and archive job do as the owner.
        env:
          TEST_ACCOUNT_POSTGRES: "1"
          ACCOUNT_DB_USER: ci
          ACCOUNT_DB_PASSWORD: ci
          ACCOUNT_DB_HOST: localhost
          ACCOUNT_DB_PORT: "5432"
          ACCOUNT_DB_NAME: ballistics
        run: python -m pytest -q -rs API/tests/test_shared_saved_postgres.py

  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend_dev
    steps:
      - uses: actions/checkout@v4
      # Same Node and pnpm as frontend_dev/Dockerfile.
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend_dev/pnpm-lock.yaml
      - name: Install dependencies
        # --no-frozen-lockfile as in the image build, so CI checks what deploys.
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck research and forecast pages
        run: |
          pnpm run typecheck:research
          pnpm run typecheck:forecast
      - name: Contract and proxy tests
        run: |
          pnpm run test:research:contracts
          pnpm run test:research:proxy
          pnpm run test:forecast:contracts
          pnpm run test:forecast:proxy

  dbt-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ballistics
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: dbt/football_pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # the dbt image
          cache: pip
          cache-dependency-path: dbt/requirements.txt
      - name: Install dbt
        run: pip install -r ../requirements.txt
      - name: Write a CI profile
        # Same profile name and schema as deploy/dbt-profiles.yml.tmpl, pointed
        # at the empty service database: compile needs a connection, not data.
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          ballistics:
            target: ci
            outputs:
              ci:
                type: postgres
                host: localhost
                port: 5432
                user: ci
                password: ci
                dbname: ballistics
                schema: raw
                threads: 4
          EOF
      - name: dbt compile
        run: dbt compile
