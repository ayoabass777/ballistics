# Dataset registry: every dataset in the daily chain, who produces it, what it
# depends on, and how the daily flow check decides it arrived for a day (ds).
#
# ds is the Airflow logical date. fixture_update_dag and engine_predict are
# @daily, so the runs that fire at 00:00 UTC on 14 Oct carry ds 2026-10-13.
#
# check types (etl/src/data_detector/daily_flow.py):
#   pipeline_task  data_detector.pipeline_runs has `task_id` of `dag_id` in
#                  `success` for ds (failed/missing otherwise)
#   movement       data_detector.data_movements has a successful
#                  `movement_type` from a `dag_id` run for ds
#   run_ds_rows    `table` has >= min_rows rows where `column` = ds
#                  (optional `where` SQL filter). With `dag` + `task`/`tasks`,
#                  a shortfall is reported as `failed` (with the task error)
#                  when a producing task failed, else `missing`
#   sql_assert     current-state rule: `sql` returns (bad_count, sample);
#                  ok when bad_count <= max_bad (default 0); independent of ds
#   crest_urls     `sql` returns (kind, logo_file_id) rows; each public crest
#                  URL must answer 200 with an image content type
#   severity       optional on any check: error (default) or warning; sets the
#                  quality event severity and marks the alert line
#   derived        no data of its own (e.g. an API view): ok when every
#                  upstream is ok
#
# Synced to data_detector.datasets / data_detector.dataset_dependencies on every
# check run. Add a dataset here when a new table joins the daily chain.

datasets:
  - id: api.fixture_updates
    layer: source
    description: Fixture updates fetched from API-Sports
    producer: {dag: fixture_update_dag, task: extract_updates}
    upstream: []
    check: {type: movement, dag: fixture_update_dag, movement_type: api_to_s3}

  - id: raw.raw_fixtures
    layer: raw
    description: Fixtures loaded from the S3 landing file
    producer: {dag: fixture_update_dag, task: load_updates}
    upstream: [api.fixture_updates]
    check: {type: movement, dag: fixture_update_dag, movement_type: s3_to_raw}

  - id: raw.raw_fixtures.corrections
    layer: raw
    description: Rescheduled kickoff corrections applied to raw fixtures
    producer: {dag: fixture_update_dag, task: fixture_corrections}
    upstream: [raw.raw_fixtures]
    check: {type: pipeline_task, dag: fixture_update_dag, task: fixture_corrections}

  - id: raw.fixture_xg
    layer: raw
    description: Expected goals for played fixtures
    producer: {dag: fixture_update_dag, task: extract_xg_task}
    upstream: [raw.raw_fixtures.corrections]
    check: {type: pipeline_task, dag: fixture_update_dag, task: extract_xg_task}

  - id: raw.raw_league_standings
    layer: raw
    description: League tables from API-Sports (one group per table)
    producer: {dag: fixture_update_dag, task: update_standings_task}
    upstream: [raw.fixture_xg]
    check: {type: pipeline_task, dag: fixture_update_dag, task: update_standings_task}

  - id: dbt.run
    layer: dbt
    description: dbt build of staging, facts and marts
    producer: {dag: fixture_update_dag, task: run_dbt}
    upstream: [raw.raw_fixtures.corrections, raw.fixture_xg, raw.raw_league_standings]
    check: {type: pipeline_task, dag: fixture_update_dag, task: run_dbt}

  - id: raw.fact_fixtures
    layer: dbt
    description: Fixture fact (warehouse ids, crest ids); the engine's only fixture source
    producer: {dag: fixture_update_dag, task: run_dbt}
    upstream: [dbt.run]
    check: {type: pipeline_task, dag: fixture_update_dag, task: run_dbt}

  - id: raw.fact_head_to_head
    layer: dbt
    description: Played meetings per team pair (engine training, match page H2H)
    producer: {dag: fixture_update_dag, task: run_dbt}
    upstream: [dbt.run]
    check: {type: pipeline_task, dag: fixture_update_dag, task: run_dbt}

  - id: raw_mart.mart_league_standings
    layer: dbt
    description: League standings mart behind the match page Context
    producer: {dag: fixture_update_dag, task: run_dbt}
    upstream: [dbt.run]
    check: {type: pipeline_task, dag: fixture_update_dag, task: run_dbt}

  - id: engine.refresh_elo
    layer: engine
    description: Elo ratings rebuilt from fixture facts (feeds the Mismatch model)
    producer: {dag: engine_predict, task: refresh_elo}
    upstream: [raw.fact_fixtures]
    check: {type: pipeline_task, dag: engine_predict, task: refresh_elo}

  - id: raw.model_runs
    layer: engine
    description: One readiness row per model (mismatch, bayesian, dixon_coles)
    producer: {dag: engine_predict, task: model_*}
    upstream: [engine.refresh_elo, raw.fact_fixtures, raw.fact_head_to_head]
    check: {type: run_ds_rows, table: raw.model_runs, column: run_ds,
            where: "status IN ('ok', 'empty')", min_rows: 3,
            dag: engine_predict, tasks: [model_mismatch, model_bayesian, model_dixon_coles]}

  - id: raw.model_picks
    layer: engine
    description: Model signals feeding consensus
    producer: {dag: engine_predict, task: model_*}
    upstream: [raw.model_runs]
    check: {type: run_ds_rows, table: raw.model_picks, column: run_ds, min_rows: 1,
            dag: engine_predict, tasks: [model_mismatch, model_bayesian, model_dixon_coles]}

  - id: raw.consensus_pool
    layer: engine
    description: Ranked consensus pool for the day
    producer: {dag: engine_predict, task: consensus}
    upstream: [raw.model_picks]
    check: {type: run_ds_rows, table: raw.consensus_pool, column: run_ds, min_rows: 1,
            dag: engine_predict, task: consensus}

  - id: raw.engine_runs
    layer: engine
    description: Run marked complete once match pages are written
    producer: {dag: engine_predict, task: consensus}
    upstream: [raw.consensus_pool]
    check: {type: run_ds_rows, table: raw.engine_runs, column: run_ds,
            where: "status = 'complete'", min_rows: 1, dag: engine_predict, task: consensus}

  - id: raw.match_analysis
    layer: engine
    description: Page-ready Strength, Patterns, Goals per fixture
    producer: {dag: engine_predict, task: consensus}
    upstream: [raw.engine_runs]
    check: {type: run_ds_rows, table: raw.match_analysis, column: run_ds, min_rows: 1,
            dag: engine_predict, task: consensus}

  - id: engine.daily_shortlists
    layer: engine
    description: Validation of the day's curated shortlists (Discover)
    producer: {dag: engine_predict, task: verify_daily_shortlists}
    upstream: [raw.consensus_pool]
    check: {type: pipeline_task, dag: engine_predict, task: verify_daily_shortlists}

  - id: engine.forecast_settlement
    layer: engine
    description: Forecast record initialised and past forecasts settled
    producer: {dag: engine_predict, task: settle_forecast_history}
    upstream: [raw.fact_fixtures]
    check: {type: pipeline_task, dag: engine_predict, task: settle_forecast_history}

  - id: s3.crests.coverage
    layer: api
    description: Every team and league in the next 14 days of fixtures has a crest id
    producer: {dag: bootstrap_dag, task: extract_metadata}
    upstream: [raw.fact_fixtures]
    check:
      type: sql_assert
      severity: warning              # a missing crest shows initials; page still works
      max_bad: 0
      sql: |
        WITH upcoming AS (
          SELECT * FROM raw.fact_fixtures
          WHERE kickoff_utc >= now() AND kickoff_utc < now() + interval '14 days'
        ), missing AS (
          SELECT DISTINCT 'team: ' || name AS item
          FROM upcoming f
          CROSS JOIN LATERAL (VALUES (home_team_id, home_team_name, home_logo_file_id),
                                     (away_team_id, away_team_name, away_logo_file_id)) v(id, name, logo)
          WHERE v.id IS NOT NULL AND v.logo IS NULL
          UNION
          SELECT DISTINCT 'league: ' || l.league_name
          FROM upcoming f JOIN dim.dim_leagues l ON l.league_id = f.league_id
          WHERE l.logo_file_id IS NULL
        )
        SELECT (SELECT count(*) FROM missing),
               (SELECT string_agg(item, ', ') FROM (SELECT item FROM missing ORDER BY item LIMIT 10) s)

  - id: s3.crests.reachable
    layer: api
    description: A sample of public crest URLs answers 200 with an image (bucket policy, objects present)
    producer: {dag: bootstrap_dag, task: extract_metadata}
    upstream: []                     # checked even when coverage has gaps
    check:
      type: crest_urls
      severity: error
      sql: |
        (SELECT 'teams', logo_file_id::text FROM dim.dim_teams
          WHERE logo_file_id IS NOT NULL ORDER BY random() LIMIT 5)
        UNION ALL
        (SELECT 'leagues', logo_file_id::text FROM dim.dim_leagues
          WHERE logo_file_id IS NOT NULL ORDER BY random() LIMIT 2)

  - id: api.match_page
    layer: api
    description: GET /api/match/{id} (engine sections + live Context)
    producer: {dag: null, task: null}
    upstream: [raw.match_analysis, raw_mart.mart_league_standings, raw.fact_head_to_head]
    check: {type: derived}
