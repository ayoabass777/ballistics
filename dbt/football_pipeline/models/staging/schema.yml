version: 2

models:
  # ── stg_raw_fixtures (incremental) ──────────────────────────────────
  - name: stg_raw_fixtures
    description: "Staged fixtures with is_played flag derived from fixture_status. Incremental on updated_at."
    columns:
      - name: fixture_id
        tests: [not_null, unique]
      - name: api_fixture_id
        tests: [not_null, unique]
      - name: api_league_id
        tests: [not_null]
      - name: season
        tests: [not_null]
      - name: kickoff_utc
        tests: [not_null]
      - name: fixture_status
        tests: [not_null]
      - name: home_api_team_id
        description: "API-Football team id (raw home_team_id). Translate via stg_dim_teams; never use past staging."
        tests: [not_null]
      - name: away_api_team_id
        description: "API-Football team id (raw away_team_id)."
        tests: [not_null]
      - name: is_played
        description: "True when fixture_status = 'FT'."
        tests: [not_null]
      - name: updated_at
        tests: [not_null]

  # ── stg_dim_teams ───────────────────────────────────────────────────
  - name: stg_dim_teams
    description: "Staged teams dimension from ETL pipeline."
    columns:
      - name: team_id
        tests: [not_null, unique]
      - name: api_team_id
        tests: [not_null, unique]
      - name: team_name
        tests: [not_null]

  # ── stg_dim_leagues ─────────────────────────────────────────────────
  - name: stg_dim_leagues
    description: "Staged leagues dimension from ETL pipeline."
    columns:
      - name: league_id
        tests: [not_null, unique]
      - name: api_league_id
        tests: [not_null, unique]
      - name: league_name
        tests: [not_null]
      - name: country_id
        tests: [not_null]

  # ── stg_dim_league_seasons ──────────────────────────────────────────
  - name: stg_dim_league_seasons
    description: "Staged league seasons with computed is_current flag."
    columns:
      - name: league_season_id
        tests: [not_null, unique]
      - name: league_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_dim_leagues')
              field: league_id
      - name: season
        tests: [not_null]
      - name: start_date
        tests: [not_null]
      - name: end_date
        tests: [not_null]
      - name: is_current
        tests: [not_null]

  # ── stg_dim_countries ───────────────────────────────────────────────
  - name: stg_dim_countries
    description: "Staged countries dimension from ETL pipeline."
    columns:
      - name: country_id
        tests: [not_null, unique]
      - name: country_name
        tests: [not_null]

  # ── stg_raw_league_standings_status ─────────────────────────────────
  - name: stg_raw_league_standings_status
    description: >
      Per league season: did the last standings refresh park rows in the S3 DLQ
      (D147). has_unprocessed_rows = the table is incomplete until a clean refresh.
    columns:
      - name: league_season_id
        tests: [not_null, unique]
      - name: has_unprocessed_rows
        tests: [not_null]

  # ── stg_raw_league_standings ────────────────────────────────────────
  - name: stg_raw_league_standings
    description: "Staged league standings with team rank, form, and goal stats."
    columns:
      - name: league_season_id
        tests: [not_null]
      - name: api_team_id
        tests: [not_null]
      - name: rank
        tests: [not_null]
      - name: games_played
        tests: [not_null]
      - name: wins
        tests: [not_null]
      - name: draws
        tests: [not_null]
      - name: losses
        tests: [not_null]

  # ── data detector staging ──────────────────────────────────────────
  - name: stg_data_detector_pipeline_runs
    description: "Staged detector records for Airflow task lifecycle events."
    columns:
      - name: pipeline_run_id
        tests: [not_null, unique]
      - name: run_id
        tests: [not_null]
      - name: dag_id
        tests: [not_null]
      - name: status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['running', 'started', 'success', 'failed', 'skipped']
      - name: created_at
        tests: [not_null]
      - name: updated_at
        tests: [not_null]

  - name: stg_data_detector_data_movements
    description: "Staged detector records for movement between API, S3, raw tables, replay, and corrections."
    columns:
      - name: data_movement_id
        tests: [not_null, unique]
      - name: movement_type
        tests: [not_null]
      - name: source_system
        tests: [not_null]
      - name: failed_count
        tests: [not_null]
      - name: status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['success', 'failed', 'skipped']
      - name: detected_at
        tests: [not_null]

  - name: stg_data_detector_table_snapshots
    description: "Staged detector records for table row counts, update watermarks, and snapshot details."
    columns:
      - name: table_snapshot_id
        tests: [not_null, unique]
      - name: table_schema
        tests: [not_null]
      - name: table_name
        tests: [not_null]
      - name: row_count
        tests: [not_null]
      - name: snapshot_at
        tests: [not_null]

  - name: stg_data_detector_data_quality_events
    description: "Staged detector records for stale data, load failures, DLQ events, and other quality signals."
    columns:
      - name: data_quality_event_id
        tests: [not_null, unique]
      - name: severity
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['info', 'warning', 'error', 'critical']
      - name: check_name
        tests: [not_null]
      - name: status
        tests: [not_null]
      - name: detected_at
        tests: [not_null]

  # ── stg_raw_fixture_xg ──────────────────────────────────────────────
  - name: stg_raw_fixture_xg
    description: "Expected goals per fixture (view over raw.fixture_xg). Covered leagues only."
    columns:
      - name: fixture_id
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_raw_fixtures')
                field: fixture_id
      - name: captured_at
        tests: [not_null]
