version: 2

models:
  - name: fact_fixture_xg
    description: >
      Expected goals per played fixture (covered leagues only), with warehouse team ids.
      Read by the engine (Dixon-Coles xG blend) instead of raw.fixture_xg.
    columns:
      - name: fixture_id
        tests: [not_null, unique]
      - name: league_season_id
        tests: [not_null]
      - name: kickoff_utc
        tests: [not_null]
      - name: home_team_id
        tests: [not_null]
      - name: away_team_id
        tests: [not_null]
      - name: home_xg
        tests: [not_null]
      - name: away_xg
        tests: [not_null]

  - name: fact_fixtures
    description: >
      Every fixture (all statuses) with warehouse team and league ids. The engine reads
      fixtures from here, never from raw.raw_fixtures. api_league_id is transitional.
    columns:
      - name: fixture_id
        tests: [not_null, unique]
      - name: api_league_id
        tests: [not_null]
      - name: kickoff_utc
        tests: [not_null]
      - name: fixture_status
        tests: [not_null]
      - name: home_team_id
        tests:
          - not_null:
              config: {severity: warn}
          - relationships:
              arguments:
                to: ref('stg_dim_teams')
                field: team_id
      - name: away_team_id
        tests:
          - not_null:
              config: {severity: warn}
          - relationships:
              arguments:
                to: ref('stg_dim_teams')
                field: team_id
      - name: league_season_id
        tests:
          - not_null:
              config: {severity: warn}
      - name: round
        description: "API-Football league.round (\"Regular Season - 12\", \"Semi-finals\"). NULL until backfilled."
        tests:
          - not_null:
              config: {severity: warn}
      - name: phase
        description: "round without its matchday number (\"Regular Season\", \"Relegation Group\", \"Semi-finals\")."
      - name: stage
        description: >
          Format: 'league' (round-robin: a team plays 3+ games in the phase) or 'knockout'
          (single games / ties, or a label naming one: final, semis, Round of 16, play-in...).
          Macros fixture_phase / fixture_knockout_name.
        tests:
          - accepted_values:
              arguments:
                values: ['league', 'knockout']
      - name: is_knockout
        description: "stage = 'knockout'. Single games / ties where extra time and penalties can decide."
      - name: is_playoff
        description: "Post-season: knockout games plus phases named play-offs (round-robin play-off groups)."
